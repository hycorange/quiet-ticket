[package]
name = "quiet-ticket"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "QuietTicket (静票): claim-ticket silent voting template for Tari Ootle"
authors = ["Orange Soda <49815085+hycorange@users.noreply.github.com>"]
repository = "https://github.com/hycorange/quiet-ticket"
rust-version = "1.97"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tari_template_lib = "0.37"

[dev-dependencies]
tari_template_test_tooling = "0.49"
tari_ootle_transaction = "0.49"
tari_template_lib_types = "0.36"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
